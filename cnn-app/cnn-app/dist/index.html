<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meridian Wire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..900&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400..700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<div class="wrap">
  <div class="util">
    <span id="today"></span>
    <button type="button" id="theme" aria-label="Switch colour theme">Theme</button>
  </div>
  <div class="mast">
    <a class="logo" href="#home" aria-label="Meridian Wire home">
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="24" cy="24" rx="9" ry="21" fill="none" stroke="currentColor" stroke-width="2.5"/><line x1="3" y1="24" x2="45" y2="24" stroke="currentColor" stroke-width="2.5"/><circle cx="33" cy="24" r="4.5" style="fill:var(--accent)"/></svg>
      <span class="wm">Meridian <span>Wire</span></span>
    </a>
    <form class="search" id="sf" role="search">
      <label class="sr" for="q">Search stories</label>
      <input id="q" type="search" placeholder="Search stories" autocomplete="off">
      <button type="submit">Search</button>
    </form>
  </div>
</div>

<nav class="nav" aria-label="Sections"><ul id="nav"></ul></nav>

<div class="wrap">
  <div class="ticker" role="region" aria-label="Breaking news">
    <span class="tag">Breaking</span>
    <a id="tick" href="#home">Loading headlines</a>
  </div>
  <main id="main"><div id="app" aria-live="polite"></div></main>
  <footer>
    <div>
      <h2>Meridian Wire</h2>
      <p>Reporting from six continents, filed as it happens.</p>
      <p class="demo">Demonstration site. Every story, name and figure here is fictional sample content served from a mock API.</p>
    </div>
    <div>
      <h2>Sections</h2>
      <ul id="foot-nav"></ul>
    </div>
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
